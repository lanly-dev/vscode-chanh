  <div class="app">
    <!-- Title bar -->
    <header class="titlebar">
      <div class="titlebar-left">
        <nav class="menus" aria-label="Menu">
          <button>File</button><button>Edit</button><button>Selection</button><button>View</button>
          <button>Go</button><button>Run</button><button>Terminal</button><button>Help</button>
        </nav>
      </div>
      <div class="titlebar-center">vscode-chanh — Visual Studio Code</div>
      <div class="titlebar-right">
        <button class="demo-button" id="startTourBtn" title="Take a guided tour of the mockup">
          <svg class="icon"><use href="#i-play"></use></svg>
          <span>Play demo</span>
        </button>
        <div class="window-controls" aria-hidden="true">
          <span>–</span><span class="max">▢</span><span class="close">×</span>
        </div>
      </div>
    </header>

    <div class="main">
      <!-- Activity bar -->
      <nav class="activitybar" aria-label="Activity bar">
        <button class="activity" title="Explorer" data-activity="explorer"><svg class="icon"><use href="#i-files"></use></svg></button>
        <button class="activity" title="Search" data-activity="search"><svg class="icon"><use href="#i-search"></use></svg></button>
        <button class="activity" title="Source Control" data-activity="git"><svg class="icon"><use href="#i-git"></use></svg><span class="badge">2</span></button>
        <button class="activity" title="Run and Debug" data-activity="debug"><svg class="icon"><use href="#i-debug"></use></svg></button>
        <button class="activity" title="Extensions" data-activity="extensions"><svg class="icon"><use href="#i-extensions"></use></svg></button>
        <button class="activity active" title="Chanh" data-activity="chanh"><img src="assets/chanh.svg" alt="Chanh" class="activity-logo" /></button>
        <div class="activity-spacer"></div>
        <button class="activity" title="Accounts" data-activity="account"><svg class="icon"><use href="#i-account"></use></svg></button>
        <button class="activity" title="Manage" data-activity="manage"><svg class="icon"><use href="#i-gear"></use></svg></button>
      </nav>

      <!-- Chanh sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="view-titlebar">
          <span class="view-title">Chanh: Server</span>
          <div class="view-actions">
            <button class="icon-button" data-view-action="refresh" title="Refresh Server Status"><svg class="icon"><use href="#i-refresh"></use></svg></button>
            <button class="icon-button" data-view-action="toggleHide" id="toggleHideBtn" title="Hide Installed &amp; Downloadable Sections"><svg class="icon"><use href="#i-eye"></use></svg></button>
            <button class="icon-button" data-view-action="settings" title="Open Settings"><svg class="icon"><use href="#i-gear"></use></svg></button>
            <button class="icon-button" data-view-action="more" title="More Actions"><svg class="icon"><use href="#i-more"></use></svg></button>
          </div>
        </div>
        <div class="tree" id="tree" role="tree" aria-label="Chanh servers and models"></div>
      </aside>

      <!-- Editor -->
      <section class="editor" id="editor">
        <div class="tabbar" id="tabbar" role="tablist"></div>
        <div class="editor-body" id="editorBody">
          <div class="view active" id="view-model-info" data-view="model-info"></div>
          <div class="view" id="view-chat" data-view="chat"></div>
          <div class="view" id="view-settings" data-view="settings"></div>
          <div class="view" id="view-json" data-view="json"></div>
          <div class="empty-editor" id="emptyEditor">
            <img src="assets/chanh.svg" alt="" class="empty-logo" />
            <h2>Chanh <span>🍋</span></h2>
            <p>Run a local AI server, right inside VS Code.</p>
            <div class="empty-hints">
              <span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>P</kbd> Command palette</span>
              <span>Open a model from the Chanh sidebar to get started.</span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Status bar -->
    <footer class="statusbar">
      <div class="status-left">
        <button class="status-item" title="Source Control"><svg class="icon"><use href="#i-git"></use></svg> main*</button>
        <button class="status-item" title="Problems">⊗ 0 <span class="status-warning">⚠ 0</span></button>
      </div>
      <div class="status-right">
        <button class="status-item">Ln 42, Col 18</button>
        <button class="status-item">Spaces: 2</button>
        <button class="status-item">UTF-8</button>
        <button class="status-item">LF</button>
        <button class="status-item">TypeScript</button>
        <button class="status-item" title="Notifications"><span class="bell">🔔</span></button>
      </div>
    </footer>
  </div>

  <div id="overlayRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="tourRoot"></div>

  <script src="app.js"></script>
</body>
</html>
